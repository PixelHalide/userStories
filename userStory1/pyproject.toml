[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-scraper"
version = "0.1.0"
description = "Scrape and normalize employee data from a JSON API."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[project.scripts]
employee-scraper = "employee_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]
